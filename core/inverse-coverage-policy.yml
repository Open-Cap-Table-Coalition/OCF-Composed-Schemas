# OCF Core — inverse-coverage schema roles (curated; hand-edited).
#
# This is role metadata, not a target denylist. Definitions remain in the raw
# Carta denominator and can still appear in type correspondences, but their
# role controls whether an unrooted object-like definition is presented as an
# actionable inverse gap.
#
# Unlisted definitions are inferred from mapping evidence and structural
# reachability. A new unclassified object-like definition is intentionally
# reported as `review` rather than silently omitted.

# Role vocabulary:
#   value-type   reusable scalar/value wrapper; never a standalone business entity
#   nested-obj   supporting object; never a standalone mapping target
#   alternate    alternate or unreachable schema shape
#   report-rollup derived/read-model aggregate rather than an OCF source fact
#   vendor-family CARTA-specific family with no OCF source object
#   workflow-gap workflow/data shape absent from OCF's event model
#   gap          concrete inverse candidate requiring follow-up
# An entry may also set `override: true` when its curated role must supersede
# executable shape evidence (for example, an orphaned report summary that a
# forward mapping can mention but that cannot seed an inverse source record).

carta_defs:
  # These are intentionally listed even though their one-property shape already
  # keeps them out of the object-like candidate denominator. The explicit role
  # makes the policy reusable if a future bundle changes their shape.
  Decimal:
    role: value-type
    reason: Reusable scalar value wrapper, not a standalone Carta entity.
  Iso3166Set1Alpha3Code:
    role: value-type
    reason: Reusable scalar value wrapper, not a standalone Carta entity.
  Iso3166Set2Code:
    role: value-type
    reason: Reusable scalar value wrapper, not a standalone Carta entity.
  Iso4217CurrencyAlphaCode:
    role: value-type
    reason: Reusable scalar value wrapper, not a standalone Carta entity.
  Iso8601CompleteCalendarDate:
    role: value-type
    reason: Reusable calendar-date wrapper, populated through owning object properties.
  Iso8601CompleteCalendarDateTime:
    role: value-type
    reason: Reusable datetime wrapper, populated through owning object properties.

  OptionExercise:
    role: workflow-gap
    reason: Carta exercise-request workflow object; OCF maps the realized transaction instead.
  OptionExerciseMoneyMovement:
    role: workflow-gap
    reason: Nested Carta exercise-funding workflow data has no OCF source.
  OptionExerciseTaxWithholdingLineItem:
    role: workflow-gap
    reason: Nested Carta tax-withholding workflow data has no OCF source.
  Jurisdiction:
    role: workflow-gap
    reason: Carta tax-withholding jurisdiction; OCF address/exemption jurisdictions are different concepts.
