# OCF Core — reference graph + payload model (curated; hand-edited).
#
# Closure metadata the OCF schemas don't encode — an id is just a string, so
# *which* object each `*_id` points to has to be stated. Drives §3 admissibility
# (scripts/lib/core-admissibility.ts). Like core/allow-list.yml this names
# RELATIONSHIPS, never field shapes — the generator owns those.
#
# `security_id` is handled in code, not here: an issuance CREATES it (no
# obligation); any other transaction REFERENCES the security it created.

# OCF foreign-key field → referent OCF object (a `core` one of these is a
# closure obligation: the referent must itself be Core-admissible).
references:
  stock_class_id: StockClass
  stock_class_ids: StockClass
  stakeholder_id: Stakeholder
  stock_plan_id: StockPlan
  vesting_terms_id: VestingTerms
  vesting_template_id: VestingTerms
  stock_legend_ids: StockLegendTemplate

# Fields that reference a SECURITY (created by some issuance), resolved like
# `security_id` against the issuance set rather than a named object. These are the
# forward-lineage links (resulting/balance security ids); only the rich profile
# promotes them to members, but classifying them here is inert for strict (where
# they are `out`) and keeps a rich member from dangling as an unknown FK.
security_references:
  - resulting_security_ids
  - resulting_security_id
  - balance_security_id
  - security_ids

# id-shaped fields that are NOT outbound FKs — human labels / externally-assigned
# ids. They impose no closure obligation.
non_references:
  - custom_id
  - issuer_assigned_id

# Bookkeeping / structural fields that carry no economic effect. A `core` field
# named here is not "payload" for the non-degeneracy gate (§3): an entity landing
# only these has no meaningful Core projection.
non_payload:
  - id
  - object_type
  - comments
  - date
  - security_id
  - custom_id
  - issuer_assigned_id
