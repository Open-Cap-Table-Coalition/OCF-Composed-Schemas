name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run mapping:validate -- --verbose
      - name: Generate inverse mapping report
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set +e
          npm run mapping:inverse > ci-artifacts/mapping-inverse-report.txt 2>&1
          status=$?
          cat ci-artifacts/mapping-inverse-report.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload inverse mapping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-inverse-report
          path: ci-artifacts/mapping-inverse-report.txt
          if-no-files-found: error
      - run: npm run mapping:coverage:check
      - run: npm run core:check
      - run: npm run core:validate-sample
