name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run mapping:validate -- --verbose
      - run: npm run mapping:question-links -- --check
      - name: Generate shared inverse coverage report
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set +e
          npm run --silent mapping:inverse > ci-artifacts/mapping-inverse-report.txt 2>&1
          status=$?
          echo '## Inverse coverage report' >> "$GITHUB_STEP_SUMMARY"
          awk '
            function close_text() {
              if (in_text) {
                print "```"
                in_text = 0
              }
            }
            function open_text() {
              if (!in_text) {
                print "```text"
                in_text = 1
              }
            }
            /^```mermaid$/ {
              close_text()
              print
              in_mermaid = 1
              next
            }
            /^```$/ && in_mermaid {
              print
              in_mermaid = 0
              next
            }
            in_mermaid {
              print
              next
            }
            {
              open_text()
              print
            }
            END {
              close_text()
            }
          ' ci-artifacts/mapping-inverse-report.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload inverse coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-inverse-report
          path: ci-artifacts/mapping-inverse-report.txt
          if-no-files-found: error
      - run: npm run mapping:coverage:check
      - run: npm run core:check
      - run: npm run core:validate-sample
