<text x="2344" y="54" fill="#1e3a8a" font-size="16"><tspan x="2344" dy="0">Carta class node</tspan></text>
<line x1="2080" y1="84" x2="2130" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"/>
<text x="2150" y="90" fill="#475569" font-size="14"><tspan x="2150" dy="0">property mapping</tspan></text>
<line x1="2080" y1="112" x2="2130" y2="112" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#contains-arrow)"/>
<text x="2150" y="118" fill="#6d28d9" font-size="14"><tspan x="2150" dy="0">contains</tspan></text>
<rect x="50" y="164" width="690" height="210" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-dasharray="8 6"/>
<text x="70" y="154" fill="#166534" font-size="18" font-weight="700"><tspan x="70" dy="0">OCF source routes</tspan></text>
<rect x="1700" y="164" width="960" height="248" rx="18" fill="#f8fbff" stroke="#7c9bd3" stroke-width="3"/>
<text x="1740" y="154" fill="#1e3a8a" font-size="18" font-weight="700"><tspan x="1740" dy="0">Carta target aggregate</tspan></text>
<text x="1722" y="188" fill="#315a9d" font-size="13" font-weight="700"><tspan x="1722" dy="0">«Carta aggregate»</tspan></text>
<path class="mapping-edge" data-target-key="parent" data-source-route="objects/VestingTerms.mapping.md|—" data-source-label="VestingTerms" data-flow-key="objects/VestingTerms.mapping.md|—|parent|id|id" d="M 720 275 C 1250.4 275, 1250.4 305, 1740 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>VestingTerms.id → VestingScheduleTemplate.id</title></path>
