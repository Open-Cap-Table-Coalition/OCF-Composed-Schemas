<path d="M 720 579 C 1250.4 579, 1250.4 857, 1740 857" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockIssuance [Default].cost_basis → CertificateTransactionItem.issuance.acquisitionCost</title></path>
