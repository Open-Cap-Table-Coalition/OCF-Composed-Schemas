<path d="M 720 681 C 1250.4 681, 1250.4 959, 1740 959" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockIssuance [Default].quantity → CertificateTransactionItem.issuance.quantity</title></path>
<path d="M 720 715 C 1250.4 715, 1250.4 305, 1740 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockIssuance [Default].security_id → CertificateTransactionItem.securityId</title></path>
<path d="M 720 749 C 1250.4 749, 1250.4 373, 1740 373" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockIssuance [Default].stakeholder_id → CertificateTransactionItem.stakeholderId</title></path>
<path d="M 720 783 C 1250.4 783, 1250.4 993, 1740 993" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockIssuance [Default].stock_class_id → CertificateTransactionItem.issuance.shareClassId</title></path>
