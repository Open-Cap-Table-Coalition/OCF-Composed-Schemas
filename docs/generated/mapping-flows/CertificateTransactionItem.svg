<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1138" viewBox="0 0 2700 1138" role="img" aria-labelledby="title desc">
<title id="title">CertificateTransactionItem structural mapping graph</title>
<desc id="desc">Native UML-like graph of OCF route nodes, Carta parent and nested variant nodes, containment edges, and property mappings.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.field{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{font-size:13px}</style>
<defs>
      <marker id="property-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
      <marker id="contains-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
      <marker id="composition-diamond" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,6 L6,0 L12,6 L6,12 z" fill="#7c3aed"/></marker>
    </defs>
<rect width="2700" height="1138" fill="#f8fafc"/>
<text x="70" y="48" fill="#0f172a" font-size="34" font-weight="700"><tspan x="70" dy="0">CertificateTransactionItem</tspan></text>
<text x="70" y="84" fill="#475569" font-size="20"><tspan x="70" dy="0">Native structural mapping graph · 3 parent properties · 2 nested variants</tspan></text>
<text x="70" y="116" fill="#64748b" font-size="16"><tspan x="70" dy="0">OCF route classes map directly to Carta parent and nested variant properties; dashed purple edges show containment.</tspan></text>
<rect x="2080" y="38" width="20" height="20" rx="4" fill="#e6f4ea" stroke="#62a576"/>
<text x="2114" y="54" fill="#166534" font-size="16"><tspan x="2114" dy="0">OCF route node</tspan></text>
<rect x="2310" y="38" width="20" height="20" rx="4" fill="#e8f0fe" stroke="#6b8fd6"/>
<text x="2344" y="54" fill="#1e3a8a" font-size="16"><tspan x="2344" dy="0">Carta class node</tspan></text>
<line x1="2080" y1="84" x2="2130" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"/>
<text x="2150" y="90" fill="#475569" font-size="14"><tspan x="2150" dy="0">property mapping</tspan></text>
<line x1="2080" y1="112" x2="2130" y2="112" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#contains-arrow)"/>
<text x="2150" y="118" fill="#6d28d9" font-size="14"><tspan x="2150" dy="0">contains</tspan></text>
<rect x="50" y="164" width="690" height="752" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-dasharray="8 6"/>
<text x="70" y="154" fill="#166534" font-size="18" font-weight="700"><tspan x="70" dy="0">OCF source routes</tspan></text>
<rect x="1720" y="164" width="920" height="930" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-dasharray="8 6"/>
<text x="1740" y="154" fill="#1e3a8a" font-size="18" font-weight="700"><tspan x="1740" dy="0">Carta target class structure</tspan></text>
<path d="M 720 303 C 1250.4 303, 1250.4 641, 1740 641" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockCancellation [Default].date → CertificateTransactionItem.cancellations[].effectiveDatetime</title></path>
<path d="M 720 337 C 1250.4 337, 1250.4 675, 1740 675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockCancellation [Default].quantity → CertificateTransactionItem.cancellations[].quantity</title></path>
<path d="M 720 371 C 1250.4 371, 1250.4 709, 1740 709" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#property-arrow)"><title>StockCancellation [Default].reason_text → CertificateTransactionItem.cancellations[].reason</title></path>
