<path d="M 720 233 C 1250.4 233, 1250.4 574, 1740 574" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#contains-arrow)"><title>StockCancellation [Default] contains cancellations[] → CertificateCancellationTransaction</title></path>
<path d="M 720 509 C 1250.4 509, 1250.4 790, 1740 790" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#contains-arrow)"><title>StockIssuance [Default] contains issuance → CertificateIssuanceTransaction</title></path>
