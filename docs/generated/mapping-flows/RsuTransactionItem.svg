    </defs>
<rect width="2700" height="1342" fill="#f8fafc"/>
<text x="70" y="48" fill="#0f172a" font-size="34" font-weight="700"><tspan x="70" dy="0">RsuTransactionItem</tspan></text>
<text x="70" y="84" fill="#475569" font-size="20"><tspan x="70" dy="0">Native structural mapping graph · 3 parent properties · 3 nested variants</tspan></text>
<text x="70" y="116" fill="#64748b" font-size="16"><tspan x="70" dy="0">OCF route classes map directly to Carta parent and nested variant properties; dashed purple edges show containment.</tspan></text>
